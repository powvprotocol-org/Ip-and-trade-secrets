<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">PoWV evidence assurance model</title>
  <desc id="desc">Six public assurance dimensions surrounding verifiable evidence.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#101418"/></linearGradient><radialGradient id="core"><stop stop-color="#153d31"/><stop offset="1" stop-color="#0c1714"/></radialGradient></defs>
  <rect width="1440" height="820" rx="32" fill="url(#bg2)"/>
  <text x="80" y="78" fill="#f4f4f5" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Evidence Assurance Model</text>
  <text x="1360" y="78" text-anchor="end" fill="#71717a" font-family="Inter,Arial,sans-serif" font-size="18">PUBLIC CAPABILITY MODEL</text>
  <g stroke="#2b5d4d" stroke-width="2"><path d="M720 392L360 230"/><path d="M720 392L1080 230"/><path d="M720 392L325 510"/><path d="M720 392L1115 510"/><path d="M720 392L500 690"/><path d="M720 392L940 690"/></g>
  <circle cx="720" cy="392" r="145" fill="url(#core)" stroke="#10b981" stroke-width="3"/>
  <text x="720" y="377" text-anchor="middle" fill="#34d399" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">VERIFIABLE</text>
  <text x="720" y="412" text-anchor="middle" fill="#f4f4f5" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">EVIDENCE</text>
  <text x="720" y="448" text-anchor="middle" fill="#a1a1aa" font-family="Inter,Arial,sans-serif" font-size="17">confidence without blind trust</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="170" y="155" width="380" height="140" rx="20" fill="#11161a" stroke="#3f3420"/><text x="205" y="205" fill="#fbbf24" font-size="23" font-weight="700">Provenance</text><text x="205" y="241" fill="#a1a1aa" font-size="17">Can the claim be attributed to an</text><text x="205" y="266" fill="#a1a1aa" font-size="17">authorized physical context?</text>
    <rect x="890" y="155" width="380" height="140" rx="20" fill="#11161a" stroke="#214237"/><text x="925" y="205" fill="#6ee7b7" font-size="23" font-weight="700">Integrity</text><text x="925" y="241" fill="#a1a1aa" font-size="17">Can unauthorized modification be</text><text x="925" y="266" fill="#a1a1aa" font-size="17">detected during review?</text>
    <rect x="135" y="440" width="380" height="140" rx="20" fill="#11161a" stroke="#214237"/><text x="170" y="490" fill="#6ee7b7" font-size="23" font-weight="700">Uniqueness</text><text x="170" y="526" fill="#a1a1aa" font-size="17">Can repeated, conflicting or reused</text><text x="170" y="551" fill="#a1a1aa" font-size="17">claims be identified?</text>
    <rect x="925" y="440" width="380" height="140" rx="20" fill="#11161a" stroke="#3f3420"/><text x="960" y="490" fill="#fbbf24" font-size="23" font-weight="700">Continuity</text><text x="960" y="526" fill="#a1a1aa" font-size="17">Does the evidence remain coherent</text><text x="960" y="551" fill="#a1a1aa" font-size="17">across custody and system boundaries?</text>
    <rect x="310" y="640" width="380" height="130" rx="20" fill="#11161a" stroke="#214237"/><text x="345" y="689" fill="#6ee7b7" font-size="23" font-weight="700">Reviewability</text><text x="345" y="725" fill="#a1a1aa" font-size="17">Can an authorized reviewer trace</text><text x="345" y="750" fill="#a1a1aa" font-size="17">the basis of a decision?</text>
    <rect x="750" y="640" width="380" height="130" rx="20" fill="#11161a" stroke="#3f3420"/><text x="785" y="689" fill="#fbbf24" font-size="23" font-weight="700">Resilience</text><text x="785" y="725" fill="#a1a1aa" font-size="17">Can evidence survive constrained or</text><text x="785" y="750" fill="#a1a1aa" font-size="17">intermittent operating conditions?</text>
  </g>
</svg>
