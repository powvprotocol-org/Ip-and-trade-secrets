<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">PoWV software validation scorecard</title>
  <desc id="desc">Twenty-five passed software test cases, three repeated hardening runs, five simulated tamper scenarios, and zero physical hardware tests.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#101418"/></linearGradient></defs>
  <rect width="1440" height="600" rx="32" fill="url(#bg)"/>
  <text x="80" y="78" fill="#f4f4f5" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Software Validation Snapshot</text>
  <text x="1360" y="78" text-anchor="end" fill="#71717a" font-family="Inter,Arial,sans-serif" font-size="18">2026-09-06 · CONTROLLED LOCAL ENVIRONMENT</text>
  <path d="M80 112H1360" stroke="#273038" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="80" y="165" width="285" height="280" rx="24" fill="#0d251e" stroke="#10b981" stroke-width="3"/>
    <text x="122" y="232" fill="#6ee7b7" font-size="20" font-weight="700">TEST CASES PASSED</text>
    <text x="122" y="345" fill="#f4f4f5" font-size="92" font-weight="800">25</text>
    <text x="122" y="398" fill="#a1a1aa" font-size="18">0 executed failures</text>
    <rect x="410" y="165" width="285" height="280" rx="24" fill="#11161a" stroke="#214237" stroke-width="2"/>
    <text x="452" y="232" fill="#6ee7b7" font-size="20" font-weight="700">HARDENING RUNS</text>
    <text x="452" y="345" fill="#f4f4f5" font-size="92" font-weight="800">3/3</text>
    <text x="452" y="398" fill="#a1a1aa" font-size="18">consistent selected results</text>
    <rect x="740" y="165" width="285" height="280" rx="24" fill="#16130d" stroke="#5a4114" stroke-width="2"/>
    <text x="782" y="232" fill="#fbbf24" font-size="20" font-weight="700">SIMULATED SCENARIOS</text>
    <text x="782" y="345" fill="#f4f4f5" font-size="92" font-weight="800">5</text>
    <text x="782" y="398" fill="#a1a1aa" font-size="18">tamper / malformed input</text>
    <rect x="1070" y="165" width="290" height="280" rx="24" fill="#11161a" stroke="#3f3420" stroke-width="2"/>
    <text x="1112" y="232" fill="#fbbf24" font-size="20" font-weight="700">PHYSICAL TESTS</text>
    <text x="1112" y="345" fill="#f4f4f5" font-size="92" font-weight="800">0</text>
    <text x="1112" y="398" fill="#a1a1aa" font-size="18">hardware not evaluated</text>
  </g>
  <rect x="80" y="490" width="1280" height="62" rx="16" fill="#0d1114" stroke="#273038"/>
  <text x="720" y="529" text-anchor="middle" fill="#a1a1aa" font-family="Inter,Arial,sans-serif" font-size="18">Research evidence only — no claim of production readiness, certification, field performance or guaranteed security.</text>
</svg>
